<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <title>Connexion</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header>

    <h1>CHU de Fès</h1>

    <p>Système de contrôle d'accès RFID</p>

</header>

<div class="container">

    <div class="card">

        <h2>Connexion Administrateur</h2>

        <form method="POST">

            <label>Nom d'utilisateur</label>

            <input
                type="text"
                name="username"
                required
            >

            <label>Mot de passe</label>

            <input
                type="password"
                name="password"
                required
            >

            <button type="submit">

                Se connecter

            </button>

        </form>

        {% if erreur %}

        <br>

        <p style="color:red">

            {{ erreur }}

        </p>

        {% endif %}

    </div>

</div>

</body>

</html>
